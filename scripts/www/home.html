<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>健身助手 - 首页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a2e 100%);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'HarmonyOS Sans', sans-serif;
            overflow-x: hidden;
            padding-bottom: 80px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        /* Header Styles */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            position: relative;
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .user-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #CCFF00, #00D1FF);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            color: #121212;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .user-avatar:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 12px rgba(204, 255, 0, 0.3);
        }

        .user-avatar::after {
            content: '';
            position: absolute;
            top: -2px;
            right: -2px;
            width: 12px;
            height: 12px;
            background: #52C41A;
            border: 2px solid #0a0a1a;
            border-radius: 50%;
        }
        
        .greeting {
            font-size: 18px;
            font-weight: 500;
        }

        .greeting-time {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 2px;
        }
        
        .calendar-btn {
            width: 40px;
            height: 40px;
            border-radius: 20px;
            background-color: rgba(255, 255, 255, 0.1);
            border: none;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 18px;
            position: relative;
        }
        
        .calendar-btn:hover {
            background-color: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }

        .calendar-btn::after {
            content: '';
            position: absolute;
            top: -2px;
            right: -2px;
            width: 8px;
            height: 8px;
            background: #FF4D4F;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.2); }
        }
        
        /* AI计划生成板块 */
        .ai-plan-generator {
            background: linear-gradient(135deg, rgba(204, 255, 0, 0.1), rgba(0, 209, 255, 0.1));
            border: 2px solid rgba(204, 255, 0, 0.3);
            border-radius: 20px;
            padding: 24px;
            margin: 20px 0;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .ai-plan-generator::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(204, 255, 0, 0.1) 0%, transparent 70%);
            animation: rotate 20s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .ai-plan-generator:hover {
            border-color: rgba(204, 255, 0, 0.5);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(204, 255, 0, 0.2);
        }

        .ai-generator-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            position: relative;
            z-index: 1;
        }

        .ai-generator-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .ai-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: linear-gradient(135deg, #CCFF00, #00D1FF);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .ai-title-text {
            flex: 1;
        }

        .ai-title-main {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .ai-title-desc {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.7);
        }

        .ai-badge {
            padding: 4px 12px;
            background: rgba(204, 255, 0, 0.2);
            border: 1px solid rgba(204, 255, 0, 0.4);
            border-radius: 12px;
            font-size: 11px;
            color: #CCFF00;
            font-weight: 600;
        }

        .ai-generator-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
            position: relative;
            z-index: 1;
        }

        .ai-option-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .ai-option-card:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(0, 209, 255, 0.3);
            transform: translateY(-2px);
        }

        .ai-option-icon {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .ai-option-text {
            font-size: 13px;
            font-weight: 500;
        }

        .ai-generate-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #CCFF00, #00D1FF);
            border: none;
            border-radius: 12px;
            color: #121212;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .ai-generate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(204, 255, 0, 0.4);
        }

        .ai-generate-btn:active {
            transform: translateY(0);
        }

        /* AI训练计划卡片 */
        .ai-planner-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 20px;
            margin: 20px 0;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .ai-planner-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(180deg, #CCFF00, #00D1FF);
        }
        
        .ai-planner-card:hover {
            border-color: rgba(0, 209, 255, 0.3);
            transform: translateY(-5px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }
        
        .ai-planner-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
        }
        
        .exercise-preview {
            width: 120px;
            height: 120px;
            border-radius: 15px;
            background: linear-gradient(135deg, rgba(204, 255, 0, 0.2), rgba(0, 209, 255, 0.2));
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .exercise-preview:hover {
            transform: scale(1.05);
        }
        
        .exercise-preview::before {
            content: '🏋️';
            font-size: 48px;
        }

        .plan-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            padding: 4px 8px;
            background: rgba(204, 255, 0, 0.9);
            border-radius: 8px;
            font-size: 10px;
            font-weight: 600;
            color: #121212;
        }
        
        .plan-details {
            flex: 1;
            margin-left: 20px;
        }
        
        .plan-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .plan-title-icon {
            font-size: 20px;
        }
        
        .plan-meta {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        
        .plan-meta-item {
            display: flex;
            align-items: center;
            gap: 5px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            padding: 6px 12px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
        }
        
        .start-training-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #CCFF00, #99FF00);
            border: none;
            border-radius: 15px;
            color: #121212;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .start-training-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 20px rgba(204, 255, 0, 0.3);
        }

        .start-training-btn:active {
            transform: scale(0.98);
        }

        .start-training-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        /* 快捷入口 */
        .quick-actions {
            margin: 30px 0;
        }
        
        .section-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
            position: relative;
            display: inline-block;
        }
        
        .section-title::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 40px;
            height: 3px;
            background: linear-gradient(90deg, #CCFF00, #00D1FF);
            border-radius: 3px;
        }
        
        .quick-entry-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 16px;
        }
        
        .entry-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .entry-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: left 0.5s ease;
        }

        .entry-btn:hover::before {
            left: 100%;
        }
        
        .entry-btn:hover {
            border-color: #00D1FF;
            background: rgba(0, 209, 255, 0.1);
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0, 209, 255, 0.2);
        }

        .entry-btn:active {
            transform: translateY(-2px);
        }
        
        .entry-btn-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: rgba(0, 209, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            transition: all 0.3s ease;
        }

        .entry-btn:hover .entry-btn-icon {
            background: rgba(0, 209, 255, 0.3);
            transform: scale(1.1);
        }
        
        .entry-btn-text {
            font-weight: 500;
            font-size: 14px;
            text-align: center;
        }

        /* 最近训练 */
        .recent-training {
            margin: 30px 0;
        }

        .recent-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .recent-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .recent-item:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(0, 209, 255, 0.3);
            transform: translateX(4px);
        }

        .recent-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: linear-gradient(135deg, rgba(204, 255, 0, 0.2), rgba(0, 209, 255, 0.2));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            flex-shrink: 0;
        }

        .recent-info {
            flex: 1;
        }

        .recent-name {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .recent-meta {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            display: flex;
            gap: 12px;
        }

        .recent-arrow {
            color: rgba(255, 255, 255, 0.4);
            font-size: 20px;
        }
        
        /* Daily Stats */
        .daily-stats {
            margin: 30px 0 100px 0;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }
        
        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, #00D1FF, #CCFF00);
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }

        .stat-card:hover::before {
            transform: scaleX(1);
        }
        
        .stat-card:hover {
            border-color: rgba(0, 209, 255, 0.3);
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 16px rgba(0, 209, 255, 0.2);
        }
        
        .stat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .stat-icon {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: rgba(0, 209, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }
        
        .stat-title {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
        }
        
        .progress-container {
            position: relative;
            width: 100%;
            height: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            overflow: hidden;
        }
        
        .progress-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            background: linear-gradient(90deg, #00D1FF, #CCFF00);
            border-radius: 5px;
            transition: width 0.8s ease;
        }
        
        .stat-value {
            margin-top: 10px;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .stat-trend {
            font-size: 12px;
            color: #52C41A;
            display: flex;
            align-items: center;
            gap: 2px;
        }

        /* 底部导航栏 */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(10, 10, 26, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px 0;
            z-index: 1000;
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.3);
        }

        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            min-width: 0;
        }

        .nav-item:hover {
            color: #00D1FF;
        }

        .nav-item.active {
            color: #CCFF00;
        }

        .nav-icon {
            font-size: 24px;
            margin-bottom: 4px;
            transition: all 0.3s ease;
        }

        .nav-item.active .nav-icon {
            transform: scale(1.1);
        }

        .nav-label {
            font-size: 12px;
            font-weight: 500;
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .user-avatar {
                width: 40px;
                height: 40px;
                font-size: 16px;
            }
            
            .greeting {
                font-size: 16px;
            }
            
            .calendar-btn {
                width: 36px;
                height: 36px;
            }
            
            .exercise-preview {
                width: 100px;
                height: 100px;
            }

            .exercise-preview::before {
                font-size: 40px;
            }
            
            .plan-title {
                font-size: 20px;
            }

            .ai-generator-options {
                grid-template-columns: repeat(2, 1fr);
            }

            .quick-entry-container {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .stats-grid {
                grid-template-columns: 1fr;
            }

            .nav-label {
                font-size: 11px;
            }

            .nav-icon {
                font-size: 20px;
            }
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 0 15px;
            }
            
            .ai-planner-header {
                flex-direction: column;
            }
            
            .plan-details {
                margin-left: 0;
                margin-top: 15px;
                width: 100%;
            }
            
            .exercise-preview {
                width: 100%;
            }

            .ai-generator-options {
                grid-template-columns: 1fr;
            }

            .quick-entry-container {
                grid-template-columns: 1fr;
            }
            
            .entry-btn {
                padding: 16px;
            }

            .nav-label {
                display: none;
            }

            .nav-icon {
                font-size: 22px;
                margin-bottom: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="user-info">
                <div class="user-avatar" id="userAvatar" title="点击查看个人中心">JD</div>
                <div>
                    <div class="greeting" id="greeting">准备好虐腹了吗？</div>
                    <div class="greeting-time" id="greetingTime"></div>
                </div>
            </div>
            <button class="calendar-btn" id="calendarBtn" title="查看训练日历">
                📅
            </button>
        </header>
        
        <!-- AI计划生成板块 -->
        <section class="ai-plan-generator">
            <div class="ai-generator-header">
                <div class="ai-generator-title">
                    <div class="ai-icon">🤖</div>
                    <div class="ai-title-text">
                        <div class="ai-title-main">AI 智能计划生成</div>
                        <div class="ai-title-desc">根据您的目标，AI为您定制专属训练计划</div>
                    </div>
                </div>
                <div class="ai-badge">NEW</div>
            </div>
            <div class="ai-generator-options">
                <div class="ai-option-card" data-option="weight-loss">
                    <div class="ai-option-icon">🔥</div>
                    <div class="ai-option-text">减脂塑形</div>
                </div>
                <div class="ai-option-card" data-option="muscle-gain">
                    <div class="ai-option-icon">💪</div>
                    <div class="ai-option-text">增肌增重</div>
                </div>
                <div class="ai-option-card" data-option="endurance">
                    <div class="ai-option-icon">🏃</div>
                    <div class="ai-option-text">提升耐力</div>
                </div>
                <div class="ai-option-card" data-option="flexibility">
                    <div class="ai-option-icon">🧘</div>
                    <div class="ai-option-text">柔韧性</div>
                </div>
            </div>
            <button class="ai-generate-btn" id="aiGenerateBtn">
                <span>✨</span>
                <span>立即生成训练计划</span>
            </button>
        </section>
        
        <!-- AI训练计划卡片 -->
        <div class="ai-planner-card" id="aiPlannerCard">
            <div class="ai-planner-header">
                <div class="exercise-preview">
                    <div class="plan-badge">推荐</div>
                </div>
                <div class="plan-details">
                    <h2 class="plan-title">
                        <span class="plan-title-icon">🎯</span>
                        <span id="planTitle">腹肌撕裂训练</span>
                    </h2>
                    <div class="plan-meta">
                        <div class="plan-meta-item">
                            ⏱️ <span id="planDuration">30分钟</span>
                        </div>
                        <div class="plan-meta-item">
                            🏃‍♂️ <span id="planExercises">8个动作</span>
                        </div>
                        <div class="plan-meta-item">
                            🔥 <span id="planCalories">~300千卡</span>
                        </div>
                    </div>
                </div>
            </div>
            <button class="start-training-btn" id="startTrainingBtn">
                <span>🚀</span>
                <span>开始 AI 纠错训练</span>
            </button>
        </div>
        
        <!-- 快捷入口 -->
        <section class="quick-actions">
            <h2 class="section-title">快捷入口</h2>
            <div class="quick-entry-container">
                <button class="entry-btn" id="manualCreateBtn">
                    <div class="entry-btn-icon">📝</div>
                    <span class="entry-btn-text">手动创建</span>
                </button>
                <button class="entry-btn" id="statisticsBtn">
                    <div class="entry-btn-icon">📊</div>
                    <span class="entry-btn-text">数据统计</span>
                </button>
                <button class="entry-btn" id="communityBtn">
                    <div class="entry-btn-icon">👥</div>
                    <span class="entry-btn-text">社区</span>
                </button>
                <button class="entry-btn" id="scanEquipmentBtn">
                    <div class="entry-btn-icon">📷</div>
                    <span class="entry-btn-text">器械扫码</span>
                </button>
            </div>
        </section>

        <!-- 最近训练 -->
        <section class="recent-training">
            <h2 class="section-title">最近训练</h2>
            <div class="recent-list" id="recentList">
                <!-- 最近训练项将通过JavaScript动态生成 -->
            </div>
        </section>
        
        <!-- Daily Stats -->
        <section class="daily-stats">
            <h2 class="section-title">今日数据</h2>
            <div class="stats-grid">
                <div class="stat-card" id="caloriesCard">
                    <div class="stat-header">
                        <div class="stat-icon">🔥</div>
                        <span class="stat-title">热量消耗</span>
                    </div>
                    <div class="progress-container">
                        <div class="progress-bar" id="caloriesProgress" style="width: 65%"></div>
                    </div>
                    <div class="stat-value">
                        <span>325/500 千卡</span>
                        <span class="stat-trend">↑ 12%</span>
                    </div>
                </div>
                <div class="stat-card" id="waterCard">
                    <div class="stat-header">
                        <div class="stat-icon">💧</div>
                        <span class="stat-title">水分摄入</span>
                    </div>
                    <div class="progress-container">
                        <div class="progress-bar" id="waterProgress" style="width: 45%"></div>
                    </div>
                    <div class="stat-value">
                        <span>1.2/2.5 升</span>
                        <span class="stat-trend">↑ 5%</span>
                    </div>
                </div>
                <div class="stat-card" id="heartCard">
                    <div class="stat-header">
                        <div class="stat-icon">❤️</div>
                        <span class="stat-title">平均心率</span>
                    </div>
                    <div class="progress-container">
                        <div class="progress-bar" id="heartProgress" style="width: 75%"></div>
                    </div>
                    <div class="stat-value">
                        <span>72 BPM</span>
                        <span class="stat-trend">正常</span>
                    </div>
                </div>
            </div>
        </section>
    </div>
    
    <!-- 底部导航栏 -->
    <nav class="bottom-nav">
        <a href="home.html" class="nav-item active" id="navHome">
            <div class="nav-icon">🏠</div>
            <div class="nav-label">首页</div>
        </a>
        <a href="calendar.html" class="nav-item" id="navCalendar">
            <div class="nav-icon">📅</div>
            <div class="nav-label">日历</div>
        </a>
        <a href="community.html" class="nav-item" id="navCommunity">
            <div class="nav-icon">👥</div>
            <div class="nav-label">社区</div>
        </a>
        <a href="profile.html" class="nav-item" id="navProfile">
            <div class="nav-icon">👤</div>
            <div class="nav-label">我的</div>
        </a>
    </nav>
    
    <!-- 引入API工具 -->
    <script src="js/api.js"></script>
    <script>
        // 页面加载完成后执行
        document.addEventListener('DOMContentLoaded', function() {
            // 生成随机问候语
            const greetings = [
                "准备好虐腹了吗？",
                "今天要突破极限！",
                "健身时间到！",
                "感觉如何，健身达人？",
                "一起加油吧！",
                "坚持就是胜利！"
            ];

            // 获取当前时间
            const now = new Date();
            const hour = now.getHours();
            let timeGreeting = '';
            if (hour >= 6 && hour < 12) {
                timeGreeting = '早上好';
            } else if (hour >= 12 && hour < 18) {
                timeGreeting = '下午好';
            } else if (hour >= 18 && hour < 22) {
                timeGreeting = '晚上好';
            } else {
                timeGreeting = '夜深了';
            }
            
            const greetingElement = document.getElementById('greeting');
            const greetingTimeElement = document.getElementById('greetingTime');
            if (greetingElement) {
                greetingElement.textContent = greetings[Math.floor(Math.random() * greetings.length)];
            }
            if (greetingTimeElement) {
                greetingTimeElement.textContent = `${timeGreeting} · ${now.toLocaleDateString('zh-CN', { month: 'long', day: 'numeric', weekday: 'long' })}`;
            }
            
            // 日历按钮点击事件
            const calendarBtn = document.getElementById('calendarBtn');
            if (calendarBtn) {
                calendarBtn.addEventListener('click', function() {
                    window.location.href = 'calendar.html';
                });
            }
            
            // AI计划卡片点击事件
            const aiPlannerCard = document.getElementById('aiPlannerCard');
            if (aiPlannerCard) {
                aiPlannerCard.addEventListener('click', function(e) {
                    // 如果点击的不是按钮，则跳转到AI助手
                    if (e.target !== document.getElementById('startTrainingBtn') && 
                        !e.target.closest('.start-training-btn')) {
                        window.location.href = 'ai-assistant.html';
                    }
                });
            }
            
            // 开始训练按钮点击事件
            const startTrainingBtn = document.getElementById('startTrainingBtn');
            if (startTrainingBtn) {
                startTrainingBtn.addEventListener('click', function() {
                    this.disabled = true;
                    this.innerHTML = '<span>⏳</span><span>准备中...</span>';
                    setTimeout(() => {
                        window.location.href = 'ai-assistant.html';
                    }, 500);
                });
            }

            // AI选项卡片点击
            const aiOptionCards = document.querySelectorAll('.ai-option-card');
            aiOptionCards.forEach(card => {
                card.addEventListener('click', function() {
                    // 移除其他卡片的选中状态
                    aiOptionCards.forEach(c => c.classList.remove('active'));
                    // 添加选中状态
                    this.classList.add('active');
                    // 更新选中样式
                    this.style.background = 'rgba(0, 209, 255, 0.15)';
                    this.style.borderColor = 'rgba(0, 209, 255, 0.4)';
                });
            });

            // AI生成计划按钮
            const aiGenerateBtn = document.getElementById('aiGenerateBtn');
            if (aiGenerateBtn) {
                aiGenerateBtn.addEventListener('click', function() {
                    const selectedOption = document.querySelector('.ai-option-card.active');
                    if (!selectedOption) {
                        alert('请先选择训练目标');
                        return;
                    }
                    
                    const option = selectedOption.getAttribute('data-option');
                    this.disabled = true;
                    this.innerHTML = '<span>⏳</span><span>AI正在生成计划...</span>';
                    
                    // 跳转到AI生成页面
                    window.location.href = `ai-assistant.html?mode=generate&target=${option}`;
                });
            }
            
            // 手动创建按钮
            const manualCreateBtn = document.getElementById('manualCreateBtn');
            if (manualCreateBtn) {
                manualCreateBtn.addEventListener('click', function() {
                    window.location.href = 'manual-plan-creator.html';
                });
            }
            
            // 数据统计按钮
            const statisticsBtn = document.getElementById('statisticsBtn');
            if (statisticsBtn) {
                statisticsBtn.addEventListener('click', function() {
                    window.location.href = 'statistics.html';
                });
            }

            // 社区按钮
            const communityBtn = document.getElementById('communityBtn');
            if (communityBtn) {
                communityBtn.addEventListener('click', function() {
                    window.location.href = 'community.html';
                });
            }

            // 器械扫码按钮
            const scanEquipmentBtn = document.getElementById('scanEquipmentBtn');
            if (scanEquipmentBtn) {
                scanEquipmentBtn.addEventListener('click', function() {
                    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                        alert('正在调用摄像头...\n\n此功能需要浏览器权限支持');
                    } else {
                        alert('您的设备不支持摄像头功能');
                    }
                });
            }
            
            // 统计卡片点击事件
            const caloriesCard = document.getElementById('caloriesCard');
            const waterCard = document.getElementById('waterCard');
            const heartCard = document.getElementById('heartCard');
            
            if (caloriesCard) {
                caloriesCard.addEventListener('click', function() {
                    window.location.href = 'statistics.html?tab=calories';
                });
            }
            
            if (waterCard) {
                waterCard.addEventListener('click', function() {
                    window.location.href = 'statistics.html?tab=water';
                });
            }
            
            if (heartCard) {
                heartCard.addEventListener('click', function() {
                    window.location.href = 'statistics.html?tab=heart';
                });
            }

            // 用户头像点击事件
            const userAvatar = document.getElementById('userAvatar');
            if (userAvatar) {
                userAvatar.addEventListener('click', function() {
                    window.location.href = 'profile.html';
                });
            }

            // 加载首页数据
            async function loadHomeData() {
                try {
                    const response = await API.getHomeData();
                    if (response.code === 200) {
                        const data = response.data;
                        
                        // 更新用户信息
                        if (data.userInfo) {
                            const userAvatar = document.getElementById('userAvatar');
                            if (userAvatar && data.userInfo.avatar) {
                                userAvatar.textContent = data.userInfo.username?.charAt(0).toUpperCase() || 'U';
                            }
                        }
                        
                        // 更新当前计划
                        if (data.currentPlan) {
                            const planTitle = document.getElementById('planTitle');
                            const planDuration = document.getElementById('planDuration');
                            const planExercises = document.getElementById('planExercises');
                            const planCalories = document.getElementById('planCalories');
                            
                            if (planTitle) planTitle.textContent = data.currentPlan.name;
                            if (planDuration) planDuration.textContent = data.currentPlan.duration + '分钟';
                            if (planExercises) planExercises.textContent = data.currentPlan.exerciseCount + '个动作';
                            if (planCalories) planCalories.textContent = '~' + (data.currentPlan.calories || 0) + '千卡';
                        }
                        
                        // 更新今日数据
                        if (data.todayStats) {
                            const stats = data.todayStats;
                            
                            if (stats.calories) {
                                const progress = Math.round((stats.calories.current / stats.calories.target) * 100);
                                document.getElementById('caloriesProgress').style.width = progress + '%';
                            }
                            
                            if (stats.water) {
                                const progress = Math.round((stats.water.current / stats.water.target) * 100);
                                document.getElementById('waterProgress').style.width = progress + '%';
                            }
                            
                            if (stats.heartRate) {
                                const progress = Math.round((stats.heartRate.current / stats.heartRate.target) * 100);
                                document.getElementById('heartProgress').style.width = progress + '%';
                            }
                        }
                        
                        // 更新最近训练
                        if (data.recentTrainings && data.recentTrainings.length > 0) {
                            loadRecentTraining(data.recentTrainings);
                        } else {
                            loadRecentTraining([]);
                        }
                    }
                } catch (error) {
                    console.error('加载首页数据失败:', error);
                    // 使用默认数据
                    loadRecentTraining([]);
                    loadStats();
                }
            }

            // 加载最近训练
            function loadRecentTraining(trainings = []) {
                const recentList = document.getElementById('recentList');
                if (!recentList) return;

                recentList.innerHTML = '';
                
                if (trainings.length === 0) {
                    recentList.innerHTML = '<div style="text-align: center; color: rgba(255,255,255,0.6); padding: 20px;">暂无最近训练记录</div>';
                    return;
                }

                trainings.forEach(training => {
                    const item = document.createElement('div');
                    item.className = 'recent-item';
                    item.innerHTML = `
                        <div class="recent-icon">${training.icon || '💪'}</div>
                        <div class="recent-info">
                            <div class="recent-name">${training.planName || '训练'}</div>
                            <div class="recent-meta">
                                <span>${training.time || ''}</span>
                                <span>·</span>
                                <span>${training.duration || 0}分钟</span>
                            </div>
                        </div>
                        <div class="recent-arrow">›</div>
                    `;
                    item.addEventListener('click', () => {
                        window.location.href = 'calendar.html';
                    });
                    recentList.appendChild(item);
                });
            }

            // 加载统计数据（备用）
            function loadStats() {
                const stats = {
                    calories: { current: 325, target: 500, progress: 65 },
                    water: { current: 1.2, target: 2.5, progress: 48 },
                    heart: { current: 72, target: 100, progress: 72 }
                };

                setTimeout(() => {
                    const caloriesProgress = document.getElementById('caloriesProgress');
                    const waterProgress = document.getElementById('waterProgress');
                    const heartProgress = document.getElementById('heartProgress');
                    
                    if (caloriesProgress) caloriesProgress.style.width = stats.calories.progress + '%';
                    if (waterProgress) waterProgress.style.width = stats.water.progress + '%';
                    if (heartProgress) heartProgress.style.width = stats.heart.progress + '%';
                }, 300);
            }

            // 初始化
            loadHomeData();

            // 导航栏高亮当前页面
            const currentPage = window.location.pathname.split('/').pop() || 'home.html';
            const navItems = document.querySelectorAll('.nav-item');
            navItems.forEach(item => {
                item.classList.remove('active');
                const href = item.getAttribute('href');
                if (href && (currentPage === href || (currentPage === '' && href === 'home.html'))) {
                    item.classList.add('active');
                }
            });
        });
    </script>
</body>
</html>
