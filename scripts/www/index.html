<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户登录</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body {
            /* 健身主题：使用充满活力的绿色渐变 */
            background: linear-gradient(135deg, #00b894 0%, #00cec9 50%, #74b9ff 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        /* 添加装饰性元素 */
        body::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 100 100"><circle cx="50" cy="50" r="2" fill="rgba(255,255,255,0.3)"/></svg>') repeat;
            opacity: 0.3;
            z-index: 0;
            animation: float 30s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(5%, 5%) rotate(1deg); }
            50% { transform: translate(0, 10%) rotate(0deg); }
            75% { transform: translate(-5%, 5%) rotate(-1deg); }
        }

        .login-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 2.5rem 2rem;
            border-radius: 20px;
            width: 90%;
            max-width: 400px;
            transition: all 0.3s ease;
            position: relative;
            z-index: 1;
            overflow: hidden;
        }

        /* 健身主题装饰条 */
        .login-container::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, #00b894, #00cec9, #0984e3, #6c5ce7);
            animation: gradientShift 5s ease infinite;
            background-size: 400% 100%;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .login-container:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.2);
        }

        .login-title {
            color: #2c405a;
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 2rem;
            text-align: center;
            position: relative;
        }

        .login-title::after {
            content: '';
            display: block;
            width: 50px;
            height: 4px;
            background: #00b894;
            margin: 10px auto 0;
            border-radius: 2px;
        }

        /* 健身励志标语 */
        .motivational-slogan {
            text-align: center;
            color: #00b894;
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 2rem;
            font-style: italic;
        }

        .input-group {
            margin-bottom: 1.5rem;
            position: relative;
            z-index: 5;
        }

        .input-label {
            display: block;
            color: #555;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .input-field {
            width: 100%;
            height: 44px;
            padding: 0.8rem 1rem;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.8);
            box-sizing: border-box;
            position: relative;
            z-index: 10;
            pointer-events: auto;
            cursor: text;
            outline: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
        }

        .input-field:focus {
            outline: none;
            border-color: #00b894;
            box-shadow: 0 0 0 3px rgba(0, 184, 148, 0.1);
            transform: translateY(-1px);
        }

        .input-field.error {
            border-color: #e74c3c;
        }

        .error-message {
            color: #e74c3c;
            font-size: 0.8rem;
            margin-top: 0.3rem;
        }

        .password-toggle {
            position: absolute;
            right: 1rem;
            top: 2.5rem;
            cursor: pointer;
            color: #7f8c8d;
            transition: color 0.3s ease;
        }

        .password-toggle:hover {
            color: #00b894;
        }

        .remember-me {
            display: flex;
            align-items: center;
            margin-bottom: 1.5rem;
            gap: 0.5rem;
        }

        .login-btn {
            width: 100%;
            padding: 0.8rem;
            background: linear-gradient(to right, #00b894, #00cec9);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 184, 148, 0.3);
            margin-top: 1rem;
        }

        .login-btn:hover {
            background: linear-gradient(to right, #00cec9, #00b894);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 184, 148, 0.4);
        }

        .login-btn:active {
            transform: translateY(0);
            box-shadow: 0 2px 10px rgba(0, 184, 148, 0.4);
        }

        .login-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .extra-links {
            margin-top: 1.5rem;
            display: flex;
            justify-content: space-between;
        }

        .link {
            color: #00b894;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .link:hover {
            text-decoration: underline;
            color: #00cec9;
            transform: translateX(2px);
        }

        .message {
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            text-align: center;
            font-weight: 500;
        }

        .message.success {
            background-color: rgba(0, 184, 148, 0.1);
            color: #00b894;
            border: 1px solid rgba(0, 184, 148, 0.3);
        }

        .message.error {
            background-color: rgba(231, 76, 60, 0.1);
            color: #e74c3c;
            border: 1px solid rgba(231, 76, 60, 0.3);
        }

        /* 添加响应式设计 */
        @media (max-width: 768px) {
            .login-container {
                padding: 2rem 1.5rem;
                margin: 1rem;
            }

            .login-title {
                font-size: 1.5rem;
            }

            .motivational-slogan {
                font-size: 1rem;
            }

            .input-field,
            .login-btn {
                padding: 0.75rem;
                font-size: 1rem;
            }
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 1.5rem 1.25rem;
                border-radius: 16px;
            }

            .login-title {
                font-size: 1.35rem;
                margin-bottom: 1.5rem;
            }

            .motivational-slogan {
                font-size: 0.95rem;
                margin-bottom: 1.5rem;
            }

            .input-group {
                margin-bottom: 1.25rem;
            }

            .input-label {
                font-size: 0.85rem;
            }

            .extra-links {
                flex-direction: column;
                gap: 0.75rem;
                align-items: center;
            }
        }
    </style>
</head>
<body>
    <!-- 消息提示区域 -->
    <div id="message-container" style="display: none;"></div>

    <div class="login-container">
        <h1 class="login-title">用户登录</h1>
        <p class="motivational-slogan">今天的付出，明天的改变！</p>

        <form id="login-form" onsubmit="return handleLogin(event)">
            <div class="input-group">
                <label for="username" class="input-label">用户名</label>
                <input
                    id="username"
                    type="text"
                    class="input-field"
                    placeholder="请输入用户名"
                    required
                />
                <div id="username-error" class="error-message"></div>
            </div>

            <div class="input-group">
                <label for="password" class="input-label">密码</label>
                <input
                    id="password"
                    type="password"
                    class="input-field"
                    placeholder="请输入密码"
                    required
                />
                <div class="password-toggle" onclick="togglePasswordVisibility()">
                    👁️
                </div>
                <div id="password-error" class="error-message"></div>
            </div>

            <div class="remember-me">
                <input type="checkbox" id="rememberMe" />
                <label for="rememberMe" onclick="toggleRememberMe()">记住我</label>
            </div>

            <button type="submit" class="login-btn">立即登录</button>
        </form>

        <div class="extra-links">
            <span>忘记密码？</span>
            <a href="register.html" class="link">注册新账号</a>
        </div>
    </div>

    <!-- API 模块 -->
    <script src="./js/api.js"></script>

    <script>
        // 全局变量
        let isLoading = false;
        let passwordVisible = false;

        // 显示消息函数
        function showMessage(text, type = 'success') {
            const messageContainer = document.getElementById('message-container');
            messageContainer.innerHTML = `<div class="message ${type}">${text}</div>`;
            messageContainer.style.display = 'block';

            // 3秒后自动隐藏消息
            setTimeout(() => {
                messageContainer.style.display = 'none';
            }, 3000);
        }

        // 切换密码可见性
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const toggleBtn = document.querySelector('.password-toggle');

            passwordVisible = !passwordVisible;
            passwordInput.type = passwordVisible ? 'text' : 'password';
            toggleBtn.textContent = passwordVisible ? '👁️‍🗨️' : '👁️';
        }

        // 切换记住我
        function toggleRememberMe() {
            const checkbox = document.getElementById('rememberMe');
            checkbox.checked = !checkbox.checked;
        }

        // 验证用户名
        function validateUsername(username) {
            if (!username || username.trim().length < 3 || username.trim().length > 20) {
                return '用户名长度应在3-20个字符之间';
            }
            return '';
        }

        // 验证密码
        function validatePassword(password) {
            if (!password || password.length < 6) {
                return '密码长度至少为6个字符';
            }
            return '';
        }

        // 处理登录
        async function handleLogin(event) {
            event.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const rememberMe = document.getElementById('rememberMe').checked;

            // 清除之前的错误信息
            document.getElementById('username-error').textContent = '';
            document.getElementById('password-error').textContent = '';
            document.querySelectorAll('.input-field').forEach(field => field.classList.remove('error'));

            // 验证输入
            const usernameError = validateUsername(username);
            const passwordError = validatePassword(password);

            if (usernameError) {
                document.getElementById('username-error').textContent = usernameError;
                document.getElementById('username').classList.add('error');
                return false;
            }

            if (passwordError) {
                document.getElementById('password-error').textContent = passwordError;
                document.getElementById('password').classList.add('error');
                return false;
            }

            // 防止重复点击
            if (isLoading) {
                return false;
            }

            isLoading = true;
            const loginBtn = document.querySelector('.login-btn');
            loginBtn.disabled = true;
            loginBtn.textContent = '登录中...';

            try {
                console.log('尝试登录，用户名：', username);

                // 调用登录API
                const response = await API.login(username, password, rememberMe);

                if (response.code === 200) {
                    // 如果勾选了记住我，保存用户名
                    if (rememberMe) {
                        localStorage.setItem('rememberedUsername', username);
                    } else {
                        localStorage.removeItem('rememberedUsername');
                    }

                    // 显示成功消息
                    showMessage('登录成功！正在跳转到首页...', 'success');

                    // 延迟跳转到首页
                    setTimeout(() => {
                        window.location.href = 'home.html';
                    }, 1500);
                } else {
                    showMessage(response.message || '登录失败，请检查用户名和密码', 'error');
                }
            } catch (error) {
                console.error('登录失败:', error);
                showMessage(error.message || '登录失败，请稍后重试', 'error');
            } finally {
                isLoading = false;
                loginBtn.disabled = false;
                loginBtn.textContent = '立即登录';
            }

            return false;
        }

        // 页面加载时的初始化
        document.addEventListener('DOMContentLoaded', function() {
            // 尝试从localStorage中恢复记住的用户名
            const rememberedUsername = localStorage.getItem('rememberedUsername');
            if (rememberedUsername) {
                document.getElementById('username').value = rememberedUsername;
                document.getElementById('rememberMe').checked = true;
            }

            // 添加输入事件监听器以实时验证
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');

            usernameInput.addEventListener('input', function() {
                const error = validateUsername(this.value);
                document.getElementById('username-error').textContent = error;
                this.classList.toggle('error', !!error);
            });

            passwordInput.addEventListener('input', function() {
                const error = validatePassword(this.value);
                document.getElementById('password-error').textContent = error;
                this.classList.toggle('error', !!error);
            });
        });
    </script>
</body>
</html>
