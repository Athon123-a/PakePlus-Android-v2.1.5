<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>训练日历 - 健身助手</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, #0a0a1a 0%, #1a1a2e 100%);
      min-height: 100vh;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'HarmonyOS Sans', sans-serif;
      overflow-x: hidden;
    }

    /* 顶部导航栏 */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px;
      margin-bottom: 24px;
      position: sticky;
      top: 0;
      background: rgba(10, 10, 26, 0.95);
      backdrop-filter: blur(10px);
      z-index: 100;
    }

    .back-btn {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      font-size: 20px;
      color: #fff;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .back-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .page-title {
      font-size: 20px;
      font-weight: bold;
      margin: 0;
    }

    .add-btn {
      background: linear-gradient(135deg, #CCFF00, #00D1FF);
      border: none;
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 500;
      color: #121212;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .add-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(204, 255, 0, 0.3);
    }

    .add-btn:active {
      transform: translateY(0);
    }

    /* 主容器 */
    .calendar-container {
      padding: 0 20px 40px;
    }

    /* 月份导航 */
    .month-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .nav-btn {
      background: transparent;
      border: none;
      color: #fff;
      font-size: 24px;
      cursor: pointer;
      padding: 8px;
      border-radius: 6px;
      transition: all 0.3s ease;
    }

    .nav-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .current-month {
      font-size: 16px;
      font-weight: 600;
    }

    /* 日历网格 */
    .calendar-grid {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      overflow: hidden;
      margin-bottom: 24px;
    }

    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      padding: 12px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .weekday {
      text-align: center;
      font-size: 12px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.6);
      padding: 8px 4px;
    }

    .days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      padding: 8px;
    }

    .day {
      min-height: 80px;
      padding: 8px;
      border-radius: 8px;
      position: relative;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .day:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    .day.current-month {
      color: #fff;
    }

    .day.other-month {
      color: rgba(255, 255, 255, 0.2);
    }

    .day.today {
      background: rgba(0, 209, 255, 0.1);
      border: 1px solid rgba(0, 209, 255, 0.3);
    }

    .day-number {
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 4px;
    }

    /* 日历事件标记 */
    .event-marker {
      height: 4px;
      border-radius: 2px;
      margin-top: 2px;
    }

    .event-marker.primary {
      background: linear-gradient(90deg, #CCFF00, #00D1FF);
    }

    .event-marker.secondary {
      background: #9333EA;
    }

    .event-marker.tertiary {
      background: #22C55E;
    }

    /* 计划列表 */
    .plans-section {
      margin-bottom: 24px;
    }

    .section-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 16px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title::before {
      content: '';
      width: 4px;
      height: 16px;
      background: linear-gradient(135deg, #CCFF00, #00D1FF);
      border-radius: 2px;
    }

    .selected-date {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 16px;
    }

    .plans-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .plan-item {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.3s ease;
    }

    .plan-item:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .plan-item.plan-completed {
      opacity: 0.7;
      border-color: rgba(82, 196, 26, 0.3);
    }

    .plan-status {
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 500;
    }

    .plan-status.completed {
      background: rgba(82, 196, 26, 0.2);
      color: #52C41A;
      border: 1px solid rgba(82, 196, 26, 0.4);
    }

    .plan-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .plan-info {
      flex: 1;
    }

    .plan-title {
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      margin: 0 0 4px 0;
    }

    .plan-time {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
    }

    .plan-type {
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 500;
    }

    .plan-type.ai {
      background: rgba(204, 255, 0, 0.1);
      color: #CCFF00;
      border: 1px solid rgba(204, 255, 0, 0.3);
    }

    .plan-type.manual {
      background: rgba(0, 209, 255, 0.1);
      color: #00D1FF;
      border: 1px solid rgba(0, 209, 255, 0.3);
    }

    .plan-description {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.8);
      margin-bottom: 12px;
    }

    .plan-actions {
      display: flex;
      gap: 8px;
    }

    .action-btn {
      flex: 1;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .action-btn.primary {
      background: linear-gradient(135deg, #CCFF00, #00D1FF);
      border: none;
      color: #121212;
    }

    .action-btn.primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 8px rgba(204, 255, 0, 0.3);
    }

    .action-btn.secondary {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    .action-btn.secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.3);
    }

    /* 无计划提示 */
    .no-plans {
      text-align: center;
      padding: 40px 20px;
      color: rgba(255, 255, 255, 0.5);
    }

    .no-plans-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    .no-plans-text {
      font-size: 14px;
      margin-bottom: 16px;
    }

    /* 加载动画 */
    .loading {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(10, 10, 26, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      display: none;
    }

    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      border-top-color: #00D1FF;
      animation: spin 1s ease-in-out infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* 拖放效果 */
    .plan-item.dragging {
      opacity: 0.5;
      transform: rotate(5deg);
    }
    
    .day.drag-over {
      background: rgba(0, 209, 255, 0.2);
      border: 1px dashed rgba(0, 209, 255, 0.5);
    }
    
    /* 提示弹窗 */
    .toast {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 14px;
      z-index: 9999;
      display: none;
    }
    
    /* 模态框样式 */
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      z-index: 10000;
      justify-content: center;
      align-items: center;
    }
    
    .modal-content {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 24px;
      width: 90%;
      max-width: 500px;
      max-height: 80vh;
      overflow-y: auto;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    
    .modal-header h2 {
      margin: 0;
      color: #fff;
      font-size: 20px;
    }
    
    .modal-body {
      color: rgba(255, 255, 255, 0.8);
    }
    
    .modal-footer {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }
    
    /* 选中日期样式 */
    .day.selected {
      background: rgba(0, 209, 255, 0.2);
      border: 1px solid rgba(0, 209, 255, 0.3);
    }

    /* 响应式设计 */
    @media (max-width: 768px) {
      .calendar-container {
        padding: 0 16px 40px;
      }
      
      .day {
        min-height: 60px;
        padding: 6px;
      }
      
      .plan-actions {
        flex-direction: column;
      }
    }

    @media (max-width: 480px) {
      .calendar-container {
        padding: 0 12px 40px;
      }
      
      .header {
        padding: 16px 12px;
      }
      
      .page-title {
        font-size: 18px;
      }
      
      .add-btn {
        padding: 6px 12px;
        font-size: 13px;
      }
      
      .month-nav {
        padding: 8px 12px;
      }
      
      .current-month {
        font-size: 14px;
      }
      
      .day {
        min-height: 50px;
        padding: 4px;
      }
      
      .day-number {
        font-size: 12px;
      }
      
      .event-marker {
        height: 3px;
      }
    }
  </style>
</head>
<body>
  <!-- 加载动画 -->
  <div class="loading" id="loading">
    <div class="loading-spinner"></div>
  </div>

  <!-- 提示弹窗 -->
  <div class="toast" id="toast"></div>

  <!-- 顶部导航栏 -->
  <header class="header">
    <button class="back-btn" id="backBtn">←</button>
    <h1 class="page-title">训练日历</h1>
    <button class="add-btn" id="addPlanBtn">添加计划</button>
  </header>

  <div class="calendar-container">
    <!-- 月份导航 -->
    <div class="month-nav">
      <button class="nav-btn" id="prevMonthBtn">←</button>
      <span class="current-month" id="currentMonthText">2024年1月</span>
      <button class="nav-btn" id="nextMonthBtn">→</button>
    </div>

    <!-- 日历网格 -->
    <div class="calendar-grid">
      <div class="weekdays">
        <div class="weekday">日</div>
        <div class="weekday">一</div>
        <div class="weekday">二</div>
        <div class="weekday">三</div>
        <div class="weekday">四</div>
        <div class="weekday">五</div>
        <div class="weekday">六</div>
      </div>
      <div class="days" id="calendarDays">
        <!-- 日历日期将通过JavaScript动态生成 -->
      </div>
    </div>

    <!-- 当日计划列表 -->
    <section class="plans-section">
      <h2 class="section-title">今日计划</h2>
      <div class="selected-date" id="selectedDateText">2024年1月15日</div>
      <div class="plans-list" id="plansList">
        <div class="plan-item">
          <div class="plan-header">
            <div class="plan-info">
              <h3 class="plan-title">全身力量训练计划</h3>
              <div class="plan-time">19:30 - 20:30</div>
            </div>
            <span class="plan-type ai">AI生成</span>
          </div>
          <div class="plan-description">包含7个动作，重点锻炼全身肌肉群，适合中级水平。</div>
          <div class="plan-actions">
            <button class="action-btn primary start-training-btn" data-id="1">开始训练</button>
            <button class="action-btn secondary view-details-btn" data-id="1">查看详情</button>
          </div>
        </div>
        <div class="plan-item">
          <div class="plan-header">
            <div class="plan-info">
              <h3 class="plan-title">拉伸放松训练</h3>
              <div class="plan-time">21:30 - 22:00</div>
            </div>
            <span class="plan-type manual">手动创建</span>
          </div>
          <div class="plan-description">全身主要肌群的静态拉伸，缓解训练后的肌肉紧张。</div>
          <div class="plan-actions">
            <button class="action-btn primary start-training-btn" data-id="2">开始训练</button>
            <button class="action-btn secondary edit-plan-btn" data-id="2">编辑计划</button>
            <button class="action-btn secondary delete-plan-btn" data-id="2">删除计划</button>
          </div>
        <div>
      </div>
    </section>
  </div>

  <script>
    // DOM元素
    const backBtn = document.getElementById('backBtn');
    const addPlanBtn = document.getElementById('addPlanBtn');
    const prevMonthBtn = document.getElementById('prevMonthBtn');
    const nextMonthBtn = document.getElementById('nextMonthBtn');
    const currentMonthText = document.getElementById('currentMonthText');
    const calendarDays = document.getElementById('calendarDays');
    const selectedDateText = document.getElementById('selectedDateText');
    const plansList = document.getElementById('plansList');
    const loadingEl = document.getElementById('loading');
    const toastEl = document.getElementById('toast');
    
    // 弹窗元素
    const planDetailsModal = document.createElement('div');
    planDetailsModal.className = 'modal';
    planDetailsModal.id = 'planDetailsModal';
    planDetailsModal.style.cssText = `
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      z-index: 10000;
      justify-content: center;
      align-items: center;
    `;
    document.body.appendChild(planDetailsModal);

    // 当前日期
    let currentDate = new Date();
    let selectedDate = new Date();

    // 计划数据统一通过API管理，不再使用静态模拟数据

    // 显示加载
    function showLoading() {
      loadingEl.style.display = 'flex';
    }

    // 隐藏加载
    function hideLoading() {
      loadingEl.style.display = 'none';
    }

    // 显示提示
    function showToast(message, type = 'info', duration = 2000) {
      // 延迟获取toast元素，确保DOM已加载
      let toast = toastEl;
      if (!toast) {
        toast = document.getElementById('toast');
      }
      
      if (!toast) {
        console.log('Toast:', message);
        // 使用alert作为备用方案
        if (type === 'error') {
          alert('错误: ' + message);
        } else if (type === 'success') {
          alert('成功: ' + message);
        } else {
          alert(message);
        }
        return;
      }
      
      toast.textContent = message;
      toast.style.display = 'block';
      
      // 根据类型设置样式
      if (type === 'error') {
        toast.style.background = 'rgba(255, 77, 79, 0.9)';
      } else if (type === 'success') {
        toast.style.background = 'rgba(82, 196, 26, 0.9)';
      } else {
        toast.style.background = 'rgba(0, 0, 0, 0.8)';
      }
      
      setTimeout(() => {
        const toastElement = document.getElementById('toast');
        if (toastElement) {
          toastElement.style.display = 'none';
        }
      }, duration);
    }

    // 生成日历
    function generateCalendar(year, month) {
      calendarDays.innerHTML = '';
      
      // 获取月份的第一天和最后一天
      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0);
      
      // 获取第一天是星期几（0-6）
      const firstDayOfWeek = firstDay.getDay();
      
      // 生成上个月的剩余天数
      for (let i = firstDayOfWeek - 1; i >= 0; i--) {
        const day = new Date(year, month, -i);
        const dayElement = createDayElement(day, false);
        calendarDays.appendChild(dayElement);
      }
      
      // 生成当月的天数
      for (let i = 1; i <= lastDay.getDate(); i++) {
        const day = new Date(year, month, i);
        const dayElement = createDayElement(day, true);
        calendarDays.appendChild(dayElement);
      }
      
      // 更新当前月份显示
      const monthNames = ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'];
      currentMonthText.textContent = `${year}年${monthNames[month]}`;
      
      // 选中当天
      selectDay(selectedDate);
    }

    // 创建日历日期元素
    function createDayElement(date, isCurrentMonth) {
      const dayElement = document.createElement('div');
      dayElement.className = `day ${isCurrentMonth ? 'current-month' : 'other-month'}`;
      
      // 判断是否是今天
      const today = new Date();
      const isToday = date.getDate() === today.getDate() &&
                     date.getMonth() === today.getMonth() &&
                     date.getFullYear() === today.getFullYear();
      
      if (isToday) {
        dayElement.classList.add('today');
      }
      
      // 日期数字
      const dayNumberElement = document.createElement('div');
      dayNumberElement.className = 'day-number';
      dayNumberElement.textContent = date.getDate();
      dayElement.appendChild(dayNumberElement);
      
      // 存储日期信息
      dayElement.setAttribute('data-date', formatDate(date));
      
      // 检查是否有计划（异步加载，先不显示标记）
      // 标记将在loadCalendarData中更新
      
      // 添加点击事件
      dayElement.addEventListener('click', () => {
        selectedDate = date;
        selectDay(date);
        loadPlansForDate(date);
      });
      
      return dayElement;
    }

    // 选中日期
    function selectDay(date) {
      // 移除之前的选中状态
      const selectedDays = document.querySelectorAll('.day.selected');
      selectedDays.forEach(day => day.classList.remove('selected'));
      
      // 添加新的选中状态
      const dateStr = formatDate(date);
      const dayElement = document.querySelector(`.day[data-date="${dateStr}"]`);
      if (dayElement) {
        dayElement.classList.add('selected');
      }
      
      // 更新选中日期显示
      const year = date.getFullYear();
      const month = date.getMonth() + 1;
      const day = date.getDate();
      selectedDateText.textContent = `${year}年${month}月${day}日`;
    }

    // 加载指定日期的计划
    async function loadPlansForDate(date) {
      showLoading();

      try {
        const dateStr = formatDate(date);
        console.log('开始加载日期计划:', dateStr);
        const response = await API.getDayPlans(dateStr);
        console.log('获取日计划响应:', response);
        
        if (response.code === 200) {
          const plans = response.data.plans.map(plan => ({
            id: plan.calendarId,
            planId: plan.planId,
            title: plan.planName,
            time: plan.time || '',
            type: 'ai',
            description: '',
            exercises: plan.exercises?.length || 0,
            duration: plan.duration,
            difficulty: '中级',
            targetMuscles: [],
            status: plan.status
          }));
          
          displayPlans(plans, dateStr);
        } else {
          displayPlans([], dateStr);
        }
      } catch (error) {
        console.error('加载计划失败:', error);
        // 显示空计划列表
        displayPlans([], dateStr);
      } finally {
        hideLoading();
      }
    }
    
    // 存储当前显示的计划列表（用于查看详情）
    let currentPlans = [];
    
    // 显示计划列表
    function displayPlans(plans, dateStr) {
      plansList.innerHTML = '';
      // 保存当前计划列表
      currentPlans = plans;
      
      if (plans.length > 0) {
        plans.forEach(plan => {
          const planElement = createPlanElement(plan);
          plansList.appendChild(planElement);
        });
      } else {
        // 显示无计划提示
        const noPlansElement = document.createElement('div');
        noPlansElement.className = 'no-plans';
        noPlansElement.innerHTML = `
          <div class="no-plans-icon">📅</div>
          <div class="no-plans-text">该日期暂无训练计划</div>
          <button class="add-btn" onclick="addNewPlan()">添加计划</button>
        `;
        plansList.appendChild(noPlansElement);
      }
    }

    // 创建计划元素
    function createPlanElement(plan) {
      const planElement = document.createElement('div');
      planElement.className = 'plan-item';
      
      // 创建计划元素的拖放功能
      planElement.draggable = true;
      planElement.addEventListener('dragstart', (e) => {
        e.dataTransfer.setData('text/plain', plan.id);
        planElement.classList.add('dragging');
      });
      
      planElement.addEventListener('dragend', () => {

      return `${year}-${month}-${day}`;
    }

          let html = actions.innerHTML;
          // 移除多余的</div>标签
          html = html.replace(/<\/div>/g, '');
          actions.innerHTML = html;
        }
      });
    });

    // 导航栏高亮当前页面
    const currentPage = window.location.pathname.split('/').pop() || 'calendar.html';
    const navItems = document.querySelectorAll('.nav-item');
    navItems.forEach(item => {
      item.classList.remove('active');
      const href = item.getAttribute('href');
      if (href && (currentPage === href || (currentPage === '' && href === 'calendar.html'))) {
        item.classList.add('active');
      }
    });
</script>

  <script>
    // 日历API对接
    (function() {
      // 更新日历显示
      async function updateCalendarDisplay(calendarData) {
        // 更新日历标记
        if (calendarData && calendarData.days) {
          calendarData.days.forEach(dayData => {
            const dayElement = document.querySelector(`.day[data-date="${dayData.date}"]`);
            if (dayElement && dayData.hasPlan) {
              // 清除旧标记
              const oldMarkers = dayElement.querySelectorAll('.event-marker');
              oldMarkers.forEach(m => m.remove());
              
              // 添加新标记
              const planCount = Math.min(dayData.planCount, 3);
              for (let i = 0; i < planCount; i++) {
                const marker = document.createElement('div');
                marker.className = `event-marker ${i === 0 ? 'primary' : i === 1 ? 'secondary' : 'tertiary'}`;
                dayElement.appendChild(marker);
              }
            }
          });
        }
      }
      
      // 加载日历数据
      async function loadCalendarData(year, month) {
        try {
          const response = await API.getCalendar(year, month);
          if (response.code === 200) {
            await updateCalendarDisplay(response.data);
          }
        } catch (error) {
          console.error('加载日历数据失败:', error);
        }
      }
      
      // 在日历生成后加载数据
      const originalGenerateCalendar = window.generateCalendar;
      if (originalGenerateCalendar) {
        window.generateCalendar = function(year, month) {
          originalGenerateCalendar(year, month);
          // 生成日历后加载数据
          setTimeout(() => {
            loadCalendarData(year, month);
          }, 100);
        };
      }
      
      // 删除计划函数已经在上面定义，这里不需要重写
    })();
  </script>
