<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>健身助手 - AI全能私教助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'HarmonyOS Sans', sans-serif;
            background-color: #0a0a1a;
            color: #ffffff;
            overflow-x: hidden;
            min-height: 100vh;
            position: relative;
            padding-bottom: 80px;
        }
        
        /* 沉浸式背景与微光效果 */
        .background-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a2e 50%, #0a0a1a 100%);
            z-index: -2;
            overflow: hidden;
        }
        
        .light-flow {
            position: absolute;
            width: 150%;
            height: 150%;
            top: -25%;
            left: -25%;
            background: radial-gradient(circle at 30% 40%, rgba(0, 209, 255, 0.1) 0%, transparent 40%),
                        radial-gradient(circle at 70% 60%, rgba(0, 150, 255, 0.1) 0%, transparent 50%);
            animation: lightFlow 20s ease-in-out infinite alternate;
            z-index: -1;
        }
        
        @keyframes lightFlow {
            0% {
                transform: translate(0, 0) scale(1);
            }
            50% {
                transform: translate(5%, 5%) scale(1.1);
            }
            100% {
                transform: translate(10%, 10%) scale(1.2);
            }
        }
        
        /* 容器样式 */
        .container {
            max-width: 800px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 1;
        }
        
        /* 顶部栏 */
        .header {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
            background-color: rgba(10, 10, 26, 0.7);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 20px;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }
        
        .ai-status {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            justify-content: center;
        }
        
        .ai-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00D1FF, #0072FF);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
        }
        
        .status-text {
            font-size: 16px;
            font-weight: 500;
        }
        
        .status-text.thinking::after {
            content: '';
            animation: typing 1.5s infinite;
        }
        
        @keyframes typing {
            0%, 20% { content: ''; }
            40% { content: '.'; }
            60% { content: '..'; }
            80%, 100% { content: '...'; }
        }
        
        .settings-button {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.1);
            border: none;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .settings-button:hover {
            background-color: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }
        
        /* 主聊天区域 */
        .chat-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            min-height: 0;
        }
        
        .chat-container::-webkit-scrollbar {
            width: 8px;
        }
        
        .chat-container::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
        }
        
        .chat-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }
        
        /* 聊天气泡 */
        .user-message, .ai-message {
            max-width: 80%;
            padding: 15px 18px;
            border-radius: 18px;
            word-wrap: break-word;
            position: relative;
            line-height: 1.6;
        }
        
        .message-time {
            font-size: 0.7em;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 5px;
            text-align: right;
        }
        
        .message-container {
            display: flex;
            flex-direction: column;
            margin-bottom: 10px;
        }
        
        .user-message {
            align-self: flex-end;
            background: linear-gradient(135deg, rgba(204, 255, 0, 0.2), rgba(204, 255, 0, 0.1));
            border: 1px solid rgba(204, 255, 0, 0.3);
            color: #ffffff;
            border-bottom-right-radius: 5px;
        }
        
        .ai-message {
            align-self: flex-start;
            background: rgba(0, 209, 255, 0.1);
            border: 1px solid rgba(0, 209, 255, 0.3);
            color: #ffffff;
            border-bottom-left-radius: 5px;
        }
        
        /* 智能卡片 */
        .card {
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 20px;
            margin: 10px 0;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            overflow: hidden;
            position: relative;
        }
        
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #00D1FF, #CCFF00);
        }
        
        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
            border-color: rgba(0, 209, 255, 0.5);
        }
        
        .card-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-title-icon {
            font-size: 20px;
        }
        
        /* 计划生成界面 */
        .plan-generator {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 24px;
            margin: 20px 0;
        }

        .generator-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .generator-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #CCFF00, #00D1FF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .generator-desc {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
        }

        .requirements-section {
            margin-bottom: 24px;
        }

        .section-label {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .requirements-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin-bottom: 16px;
        }

        .requirement-card {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .requirement-card:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(0, 209, 255, 0.3);
            transform: translateY(-2px);
        }

        .requirement-card.selected {
            background: rgba(0, 209, 255, 0.15);
            border-color: #00D1FF;
        }

        .requirement-icon {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .requirement-text {
            font-size: 14px;
            font-weight: 500;
        }

        .custom-input-section {
            margin-top: 16px;
        }

        .custom-textarea {
            width: 100%;
            min-height: 100px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            color: #fff;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
            transition: all 0.3s ease;
        }

        .custom-textarea:focus {
            outline: none;
            border-color: #00D1FF;
            background: rgba(255, 255, 255, 0.08);
        }

        .custom-textarea::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .generate-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #CCFF00, #00D1FF);
            border: none;
            border-radius: 12px;
            color: #121212;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .generate-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(204, 255, 0, 0.4);
        }

        .generate-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        /* 计划卡片 */
        .workout-plan-card {
            margin: 20px 0;
        }

        .plan-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .plan-info {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .plan-info-item {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.8);
        }

        .plan-actions {
            display: flex;
            gap: 8px;
        }

        .plan-action-btn {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #fff;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .plan-action-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .plan-action-btn.primary {
            background: linear-gradient(135deg, #CCFF00, #00D1FF);
            border-color: transparent;
            color: #121212;
            font-weight: 600;
        }

        .plan-action-btn.primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(204, 255, 0, 0.3);
        }
        
        .workout-plan-card .day-nav {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            overflow-x: auto;
            padding-bottom: 5px;
        }
        
        .workout-plan-card .day-nav::-webkit-scrollbar {
            height: 4px;
        }
        
        .workout-plan-card .day-nav::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
        }
        
        .workout-plan-card .day-btn {
            padding: 8px 16px;
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            color: #ffffff;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
            font-size: 13px;
        }
        
        .workout-plan-card .day-btn.active {
            background: linear-gradient(135deg, #CCFF00, #00D1FF);
            border-color: transparent;
            color: #121212;
            font-weight: 600;
        }

        .workout-plan-card .day-btn:hover:not(.active) {
            background: rgba(255, 255, 255, 0.15);
        }
        
        .workout-plan-card .day-content {
            min-height: 200px;
        }
        
        .workout-plan-card .exercise-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            transition: all 0.3s ease;
        }

        .workout-plan-card .exercise-item:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(0, 209, 255, 0.3);
        }
        
        .workout-plan-card .exercise-info {
            display: flex;
            align-items: center;
            gap: 15px;
            flex: 1;
        }
        
        .workout-plan-card .exercise-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: linear-gradient(135deg, #00D1FF, #0072FF);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }
        
        .workout-plan-card .exercise-details {
            flex: 1;
        }

        .exercise-name {
            font-weight: 600;
            margin-bottom: 4px;
            font-size: 15px;
        }

        .exercise-specs {
            color: rgba(255, 255, 255, 0.7);
            font-size: 13px;
        }
        
        .workout-plan-card .apply-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #CCFF00, #00D1FF);
            color: #121212;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .workout-plan-card .apply-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(204, 255, 0, 0.4);
        }

        .workout-plan-card .apply-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        /* 食谱卡片 */
        .diet-card {
            padding: 20px;
        }
        
        .diet-card .nutrition-overview {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .diet-card .nutrition-chart {
            position: relative;
            width: 120px;
            height: 120px;
        }
        
        .diet-card .macros-info {
            flex: 1;
            padding-left: 20px;
        }
        
        .diet-card .macro-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        
        .diet-card .macro-color {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        
        .diet-card .protein { background-color: #FF6B6B; }
        .diet-card .carbs { background-color: #4ECDC4; }
        .diet-card .fats { background-color: #FFD166; }
        
        .diet-card .food-list {
            margin-bottom: 15px;
        }
        
        .diet-card .food-list h4 {
            font-size: 16px;
            margin-bottom: 10px;
            color: #00D1FF;
        }
        
        .diet-card .food-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .diet-card .food-icon {
            width: 30px;
            height: 30px;
            border-radius: 5px;
            background-color: rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .diet-card .add-to-diet-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #00D1FF, #0072FF);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .diet-card .add-to-diet-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 15px rgba(0, 209, 255, 0.3);
        }
        
        /* 教学卡片 */
        .instruction-card .video-container {
            width: 100%;
            aspect-ratio: 16/9;
            background-color: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            overflow: hidden;
        }
        
        .instruction-card .video-placeholder {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
            text-align: center;
            padding: 20px;
        }
        
        .instruction-card .exercise-description {
            margin-bottom: 15px;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.8);
        }
        
        .instruction-card .start-training-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #CCFF00, #00D1FF);
            color: #121212;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .instruction-card .start-training-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 15px rgba(204, 255, 0, 0.3);
        }
        
        /* 快捷指令栏 */
        .action-dock {
            display: flex;
            justify-content: space-around;
            padding: 15px 20px;
            background-color: rgba(10, 10, 26, 0.8);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        
        .action-dock::-webkit-scrollbar {
            display: none;
        }
        
        .quick-action-btn {
            padding: 10px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            color: #ffffff;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
        }
        
        .quick-action-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(0, 209, 255, 0.3);
            transform: translateY(-2px);
        }
        
        /* 输入栏 */
        .input-container {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 15px 20px;
            background-color: rgba(10, 10, 26, 0.8);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            position: sticky;
            bottom: 80px;
            z-index: 99;
        }
        
        .voice-input-btn, .image-upload-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.1);
            border: none;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 20px;
            flex-shrink: 0;
        }
        
        .voice-input-btn:hover, .image-upload-btn:hover {
            background-color: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }
        
        .voice-input-btn.recording {
            background-color: #FF6B6B;
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(255, 107, 107, 0.7);
            }
            70% {
                box-shadow: 0 0 0 10px rgba(255, 107, 107, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(255, 107, 107, 0);
            }
        }
        
        .text-input {
            flex: 1;
            padding: 12px 20px;
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            color: #ffffff;
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
        }
        
        .text-input:focus {
            border-color: #00D1FF;
            background-color: rgba(255, 255, 255, 0.15);
        }
        
        .text-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .send-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #CCFF00, #00D1FF);
            border: none;
            color: #121212;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 18px;
            flex-shrink: 0;
        }

        .send-btn:hover:not(:disabled) {
            transform: scale(1.05);
            box-shadow: 0 4px 12px rgba(204, 255, 0, 0.3);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        /* 模态框样式 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .modal-content {
            background-color: #0a0a1a;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 25px;
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .modal-title {
            font-size: 20px;
            font-weight: bold;
        }
        
        .close-modal-btn {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.1);
            border: none;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .close-modal-btn:hover {

    <!-- 引入API工具 -->
    <script src="js/api.js"></script>
    <script>
        // 全局变量
        let currentMode = 'chat'; // chat, generate
        let selectedRequirements = [];
        let generatedPlan = null;

        // 获取URL参数
        function getUrlParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                mode: params.get('mode'),
                target: params.get('target'),
                planId: params.get('planId')
            };
        }

        // 初始化页面
        function initializePage() {
            // 检查用户登录状态
            const token = API.getToken();
            if (!token) {
                console.log('用户未登录，跳转到登录页');
                window.location.href = 'index.html';
                return;
            }

            console.log('用户已登录，Token:', token ? '已设置' : '未设置');

            // 测试API连接
            testAPIConnection();

            const urlParams = getUrlParams();
            const chatContainer = document.getElementById('chatContainer');
            const messageInput = document.getElementById('messageInput');
            const sendBtn = document.getElementById('sendBtn');
            const voiceInputBtn = document.getElementById('voiceInputBtn');
            const backBtn = document.getElementById('backBtn');
            const settingsButton = document.getElementById('settingsButton');
            const settingsModal = document.getElementById('settingsModal');
            const closeSettingsModal = document.getElementById('closeSettingsModal');
            const aiStatus = document.getElementById('aiStatus');
            const actionDock = document.getElementById('actionDock');
            const loadingOverlay = document.getElementById('loadingOverlay');
            const loadingText = document.getElementById('loadingText');
            const toast = document.getElementById('toast');
            
            // 返回按钮
            if (backBtn) {
                backBtn.addEventListener('click', function() {
                    if (window.history.length > 1) {
                        window.history.back();
                } else {
                        window.location.href = 'home.html';
                    }
                });
            }

            // 检查URL参数，判断是否为生成模式
            if (urlParams.mode === 'generate') {
                currentMode = 'generate';
                showPlanGenerator(urlParams.target);
            } else if (urlParams.planId) {
                // 加载已有计划
                loadPlan(urlParams.planId);
                } else {
                // 普通聊天模式
                showWelcomeMessage();
                }

            // 发送按钮
            if (sendBtn) {
                sendBtn.addEventListener('click', sendMessage);
            }
            
            // 输入框回车
            if (messageInput) {
            messageInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                    sendMessage();
                }
            });
            
            messageInput.addEventListener('input', function() {
                    sendBtn.disabled = !this.value.trim();
                });
                }
            
            // 语音输入
            if (voiceInputBtn) {
            voiceInputBtn.addEventListener('click', function() {
                this.classList.toggle('recording');
                if (this.classList.contains('recording')) {
                    aiStatus.textContent = '正在录音...';
                } else {
                    aiStatus.textContent = 'HI, 我是你的私人教练';
                        // 模拟语音识别
                    setTimeout(() => {
                            if (messageInput) {
                                messageInput.value = '我想制定一个减脂计划';
                                messageInput.focus();
                            }
                    }, 500);
                }
            });
            }

            // 快捷操作按钮
            const quickActionBtns = document.querySelectorAll('.quick-action-btn');
            quickActionBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    const action = this.getAttribute('data-action');
                    if (messageInput) {
                        messageInput.value = action;
                        messageInput.focus();
                    }
                });
            });
            
            // 设置按钮
            if (settingsButton) {
            settingsButton.addEventListener('click', function() {
                    if (settingsModal) {
                settingsModal.style.display = 'flex';
                    }
            });
            }
            
            // 关闭设置模态框
            if (closeSettingsModal) {
            closeSettingsModal.addEventListener('click', function() {
                    if (settingsModal) {
                settingsModal.style.display = 'none';
                    }
                });
            }

            // 点击模态框背景关闭
            if (settingsModal) {
                settingsModal.addEventListener('click', function(e) {
                    if (e.target === settingsModal) {
                        settingsModal.style.display = 'none';
                    }
                });
            }

            // 初始化发送按钮状态
            if (sendBtn && messageInput) {
                sendBtn.disabled = !messageInput.value.trim();
            }
        }

        // 显示欢迎消息
        function showWelcomeMessage() {
            const chatContainer = document.getElementById('chatContainer');
            if (!chatContainer) return;

            addAIMessage('嗨！我是你的AI私人教练。我可以帮你制定健身计划、提供饮食建议、解答器械使用问题，还能进行动作纠错。有什么可以帮助你的？');
        }

        // 显示计划生成界面
        function showPlanGenerator(target) {
            const chatContainer = document.getElementById('chatContainer');
            if (!chatContainer) return;

            chatContainer.innerHTML = '';

            const targetMap = {
                'weight-loss': { icon: '🔥', name: '减脂塑形', desc: '专注于燃烧脂肪，塑造完美身材' },
                'muscle-gain': { icon: '💪', name: '增肌增重', desc: '增加肌肉量，提升力量' },
                'endurance': { icon: '🏃', name: '提升耐力', desc: '提高心肺功能和运动耐力' },
                'flexibility': { icon: '🧘', name: '柔韧性', desc: '改善身体柔韧性和灵活性' }
            };

            const targetInfo = targetMap[target] || { icon: '🎯', name: '综合训练', desc: '全面提升身体素质' };

            const generatorHTML = `
                <div class="plan-generator">
                    <div class="generator-header">
                        <div class="generator-title">${targetInfo.icon} ${targetInfo.name}</div>
                        <div class="generator-desc">${targetInfo.desc}</div>
                    </div>

                    <div class="requirements-section">
                        <div class="section-label">
                            <span>📋</span>
                            <span>选择你的需求（可多选）</span>
                        </div>
                        <div class="requirements-grid" id="requirementsGrid">
                            <div class="requirement-card" data-requirement="duration">
                                <div class="requirement-icon">⏱️</div>
                                <div class="requirement-text">训练时长</div>
                            </div>
                            <div class="requirement-card" data-requirement="frequency">
                                <div class="requirement-icon">📅</div>
                                <div class="requirement-text">训练频率</div>
                            </div>
                            <div class="requirement-card" data-requirement="equipment">
                                <div class="requirement-icon">🏋️</div>
                                <div class="requirement-text">可用器械</div>
                            </div>
                            <div class="requirement-card" data-requirement="experience">
                                <div class="requirement-icon">⭐</div>
                                <div class="requirement-text">训练经验</div>
                            </div>
                            <div class="requirement-card" data-requirement="goal">
                                <div class="requirement-icon">🎯</div>
                                <div class="requirement-text">具体目标</div>
                            </div>
                            <div class="requirement-card" data-requirement="injury">
                                <div class="requirement-icon">⚠️</div>
                                <div class="requirement-text">伤病情况</div>
                            </div>
                        </div>
                    </div>

                    <div class="custom-input-section">
                        <div class="section-label">
                            <span>✏️</span>
                            <span>或直接描述你的需求</span>
                        </div>
                        <textarea 
                            class="custom-textarea" 
                            id="customRequirement" 
                            placeholder="例如：我想每周训练4次，每次45分钟，主要在家用哑铃训练，目标是增肌..."
                        ></textarea>
                    </div>

                    <button class="generate-btn" id="generatePlanBtn">
                        <span>✨</span>
                        <span>生成训练计划</span>
                    </button>
                </div>
            `;

            chatContainer.innerHTML = generatorHTML;
            
            // 需求卡片点击事件
            const requirementCards = document.querySelectorAll('.requirement-card');
            requirementCards.forEach(card => {
                card.addEventListener('click', function() {
                    this.classList.toggle('selected');
                    const requirement = this.getAttribute('data-requirement');
                    if (this.classList.contains('selected')) {
                        if (!selectedRequirements.includes(requirement)) {
                            selectedRequirements.push(requirement);
                        }
                    } else {
                        selectedRequirements = selectedRequirements.filter(r => r !== requirement);
                    }
                });
            });
            
            // 生成计划按钮
            const generateBtn = document.getElementById('generatePlanBtn');
            if (generateBtn) {
                generateBtn.addEventListener('click', function() {
                    const customReq = document.getElementById('customRequirement')?.value.trim() || '';
                    
                    if (selectedRequirements.length === 0 && !customReq) {
                        showToast('请至少选择一个需求或填写需求描述', 'error');
                        return;
                    }

                    generatePlan(target, selectedRequirements, customReq);
                });
            }
        }

        // 生成计划
        async function generatePlan(target, requirements, customReq) {
            const loadingOverlay = document.getElementById('loadingOverlay');
            const loadingText = document.getElementById('loadingText');
            const chatContainer = document.getElementById('chatContainer');

            // 显示加载动画
            if (loadingOverlay) {
                loadingOverlay.classList.add('show');
            }

            // 更新加载提示
            const steps = [
                '分析你的需求...',
                '匹配训练方案...',
                '优化动作组合...',
                '生成个性化计划...'
            ];

            let stepIndex = 0;
            const stepInterval = setInterval(() => {
                if (stepIndex < steps.length && loadingText) {
                    loadingText.textContent = steps[stepIndex];
                    stepIndex++;
                } else {
                    clearInterval(stepInterval);
                }
            }, 800);

            try {
                // 调用AI生成计划API
                const response = await API.generatePlan(target, requirements, customReq);
                
                clearInterval(stepInterval);
                
                if (loadingOverlay) {
                    loadingOverlay.classList.remove('show');
                }

                if (response.code === 200) {
                    // 转换API返回的数据格式
                    const plan = {
                        name: response.data.name,
                        duration: response.data.duration,
                        exercises: response.data.exercises.map(ex => ({
                            name: ex.name,
                            sets: ex.sets,
                            reps: ex.reps,
                            rest: ex.rest,
                            icon: ex.icon || '💪'
                        }))
                    };
                    
                    generatedPlan = {
                        ...plan,
                        planId: response.data.planId
                    };

                    // 显示生成的计划
                    displayGeneratedPlan(generatedPlan);
                } else {
                    showToast(response.message || '生成计划失败', 'error');
                }
            } catch (error) {
                clearInterval(stepInterval);
                if (loadingOverlay) {
                    loadingOverlay.classList.remove('show');
                }
                console.error('生成计划失败:', error);
                showToast(error.message || '生成计划失败，请稍后重试', 'error');
            }
        }

        // 生成模拟计划
        function generateMockPlan(target, requirements, customReq) {
            const plans = {
                'weight-loss': {
                    name: '高效减脂训练计划',
                    duration: 45,
                    exercises: [
                        { name: '开合跳', sets: 3, reps: '30秒', rest: 30, icon: '🤸' },
                        { name: '高抬腿', sets: 3, reps: '30秒', rest: 30, icon: '🏃' },
                        { name: '波比跳', sets: 3, reps: '10次', rest: 45, icon: '💥' },
                        { name: '平板支撑', sets: 3, reps: '30秒', rest: 30, icon: '🧘' },
                        { name: '登山者', sets: 3, reps: '20次', rest: 30, icon: '⛰️' }
                    ]
                },
                'muscle-gain': {
                    name: '增肌力量训练计划',
                    duration: 60,
                    exercises: [
                        { name: '哑铃卧推', sets: 4, reps: '8-10次', rest: 90, icon: '💪' },
                        { name: '哑铃深蹲', sets: 4, reps: '10-12次', rest: 90, icon: '🏋️' },
                        { name: '哑铃划船', sets: 4, reps: '10-12次', rest: 90, icon: '🚣' },
                        { name: '哑铃肩推', sets: 3, reps: '10-12次', rest: 60, icon: '🏋️' },
                        { name: '哑铃弯举', sets: 3, reps: '12-15次', rest: 60, icon: '💪' }
                    ]
                },
                'endurance': {
                    name: '耐力提升训练计划',
                    duration: 40,
                    exercises: [
                        { name: '慢跑', sets: 1, reps: '20分钟', rest: 0, icon: '🏃' },
                        { name: '跳绳', sets: 3, reps: '2分钟', rest: 30, icon: '🪢' },
                        { name: '开合跳', sets: 3, reps: '1分钟', rest: 30, icon: '🤸' },
                        { name: '高抬腿', sets: 3, reps: '1分钟', rest: 30, icon: '🏃' }
                    ]
                },
                'flexibility': {
                    name: '柔韧性提升计划',
                    duration: 30,
                    exercises: [
                        { name: '动态拉伸', sets: 1, reps: '10分钟', rest: 0, icon: '🧘' },
                        { name: '瑜伽体式', sets: 1, reps: '15分钟', rest: 0, icon: '🧘' },
                        { name: '静态拉伸', sets: 1, reps: '5分钟', rest: 0, icon: '🧘' }
                    ]
                }
            };

            return plans[target] || plans['weight-loss'];
        }

        // 显示生成的计划
        function displayGeneratedPlan(plan) {
            const chatContainer = document.getElementById('chatContainer');
            if (!chatContainer) return;

            // 添加AI消息
            addAIMessage(`我已经为你生成了"${plan.name}"！这个计划包含${plan.exercises.length}个动作，预计时长${plan.duration}分钟。你可以查看下方的详细计划，并一键同步到日历中。`);

            // 创建计划卡片
            const planCard = document.createElement('div');
            planCard.className = 'card workout-plan-card';
            planCard.innerHTML = `

            const targetMap = {

                '柔韧': 'flexibility',
                '练胸': 'muscle-gain',

                '练肩': 'muscle-gain',
                '练手臂': 'muscle-gain',
                '练核心': 'muscle-gain'
            };

            for (const [keyword, target] of Object.entries(targetMap)) {
                if (message.includes(keyword)) {
                    return target;
                }
            }

            return 'muscle-gain'; // 默认增肌

        // 提取需求
        function extractRequirements(message) {
            const requirements = [];

            if (message.includes('30分钟') || message.includes('30分钟内') || message.includes('30min')) {
                requirements.push('duration');

            if (message.includes('器械') || message.includes('哑铃') || message.includes('跑步机') ||

                requirements.push('equipment');
            }

            if (message.includes('初学者') || message.includes('新手') || message.includes('beginner')) {
                requirements.push('experience');
            }

            return requirements;
        }

        }
        
        // 暴露函数到全局
        window.redirectToManualCreator = redirectToManualCreator;
        
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', initializePage);
    </script>
</body>
</html>
